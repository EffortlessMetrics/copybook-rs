kind: fixed
body: '**release**: extended the stable-core acceptance runner (`release_smoke.sh`,
  slice A of #988). New VB framing probes (beta positive with checked values,
  truncated/over-claimed blocks rejected with CBKF exit 4, semantic JSONL
  round-trip excluding BDW framing) and advise probes (supported exit 0,
  stable JSON envelope validation, VB effective options, invalid-input exit
  3 with CBKP021 identity, governed-corpus agreement, honest
  partial-unknown literal, wrong-value refutations). Split timing markers
  keep payloads under active errexit (a wrapper would mask intermediate
  failures); every section is timed, and a bounded sanitized acceptance
  receipt (hashes/outcomes only, ephemeral paths relativized) is emitted on
  success and on failure via trap. The blocking smoke job persists the
  receipt outside the run directory, uploads it as a transport artifact,
  and rejects non-registry-only execution. Docs.rs checks and durable
  release-asset archiving follow in slice B.'
