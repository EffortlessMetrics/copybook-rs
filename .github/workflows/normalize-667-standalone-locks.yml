# SPDX-License-Identifier: AGPL-3.0-or-later
name: Normalize 667 standalone locks

on:
  push:
    branches:
      - codex/642-rust-1-95-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/642-rust-1-95-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Restore and minimally update standalone lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            fuzz/Cargo.lock \
            examples/kafka_pipeline/Cargo.lock \
            examples/kafka_streaming/Cargo.lock
          for manifest in \
            fuzz/Cargo.toml \
            examples/kafka_pipeline/Cargo.toml \
            examples/kafka_streaming/Cargo.toml
          do
            # Preserve the existing resolution wherever possible. Unlike
            # generate-lockfile, cargo check updates only entries required by
            # the current manifests and path-package versions.
            cargo check --manifest-path "${manifest}"
            cargo check --locked --manifest-path "${manifest}"
          done
          git diff --check
      - name: Commit minimal lock repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            fuzz/Cargo.lock \
            examples/kafka_pipeline/Cargo.lock \
            examples/kafka_streaming/Cargo.lock
          if git diff --cached --quiet; then
            echo "Standalone lockfiles already minimal and current."
            exit 0
          fi
          git commit -m "build(msrv): minimally refresh standalone lockfiles"
          git push origin HEAD:codex/642-rust-1-95-v2
