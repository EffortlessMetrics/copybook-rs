# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Standalone example crate for Kafka producer/consumer streaming.
[package]
name = "kafka-streaming"
version = "0.4.3"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
authors = ["Steven Zimmerman, CPA <git@effortlesssteven.com>"]
repository = "https://github.com/EffortlessMetrics/copybook-rs"
homepage = "https://github.com/EffortlessMetrics/copybook-rs"
description = "Kafka streaming example for copybook-rs"
readme = "README.md"
keywords = ["cobol", "copybook", "mainframe", "ebcdic", "kafka"]
categories = ["command-line-utilities", "parsing", "encoding"]
publish = false

[[example]]
name = "producer"
path = "src/producer.rs"

[[example]]
name = "consumer"
path = "src/consumer.rs"

[dependencies]
copybook-core = { version = "=0.4.3", path = "../../crates/copybook-core" }
copybook-codec = { version = "=0.4.3", path = "../../crates/copybook-codec" }

futures = "0.3.31"
rdkafka = { version = "0.37", features = ["cmake-build", "ssl-vendored"] }
serde_json = "1.0.138"
thiserror = "2.0.18"
tokio = { version = "1.45.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
missing_inline_in_public_items = "warn"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
