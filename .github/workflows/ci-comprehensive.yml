# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI Comprehensive

on:
  workflow_dispatch:
  schedule:
    # Run nightly at 4 AM UTC
    - cron: '0 4 * * *'
  pull_request:
    # Manual opt-in via label; once selected, keep proof current with the head.
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  comprehensive:
    name: Comprehensive ${{ matrix.capability }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Skip if not labeled with 'comprehensive' (for PR triggers).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'comprehensive')
    strategy:
      fail-fast: false
      matrix:
        include:
          - capability: parser
            package: copybook-core
          - capability: codec
            package: copybook-codec

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: comprehensive-${{ matrix.package }}

      - name: Install nextest (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.11
          checksum: true

      - name: Run ${{ matrix.capability }} comprehensive tests
        id: comprehensive_tests
        continue-on-error: true
        run: |
          cargo nextest run \
            -p "${{ matrix.package }}" \
            --features comprehensive-tests \
            --profile ci \
            --no-fail-fast \
            --failure-output=immediate \
            --status-level=fail

      - name: Report ${{ matrix.capability }} test status
        if: always()
        run: |
          {
            echo "### ${{ matrix.capability }} comprehensive tests"
            echo ""
            echo "- owner package: \`${{ matrix.package }}\`"
            echo "- outcome: \`${{ steps.comprehensive_tests.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.comprehensive_tests.outcome }}" = "failure" ]; then
            echo "::warning::${{ matrix.capability }} comprehensive tests failed — advisory evidence recorded"
          else
            echo "::notice::${{ matrix.capability }} comprehensive tests passed"
          fi

      - name: Upload ${{ matrix.capability }} test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-test-results-${{ matrix.package }}-${{ github.sha }}
          path: |
            target/nextest/**/*.xml
            target/nextest/**/*.log
          if-no-files-found: error
          retention-days: 7
