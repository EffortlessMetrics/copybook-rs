# SPDX-License-Identifier: AGPL-3.0-or-later
name: Apply 669 capability ownership

on:
  push:
    branches:
      - codex/646-capability-aware-ci
  pull_request:
    branches:
      - codex/642-rust-1-95-v2

permissions:
  contents: write

concurrency:
  group: apply-669-capability-ownership
  cancel-in-progress: true

jobs:
  apply-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/646-capability-aware-ci
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Remove false uniform capabilities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          manifests = [
              Path('tools/copybook-gen/Cargo.toml'),
              Path('crates/copybook-rdw/Cargo.toml'),
              Path('tools/copybook-bench/Cargo.toml'),
              Path('crates/copybook-lexer/Cargo.toml'),
              Path('crates/copybook-arrow/Cargo.toml'),
              Path('crates/copybook-fixed/Cargo.toml'),
              Path('crates/copybook-cli/Cargo.toml'),
              Path('crates/copybook-charset/Cargo.toml'),
              Path('crates/copybook-dialect/Cargo.toml'),
              Path('crates/copybook-codepage/Cargo.toml'),
              Path('crates/copybook-record-io/Cargo.toml'),
          ]
          package_names = {path.parent.name for path in manifests}

          for path in manifests:
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              matches = [index for index, line in enumerate(lines) if line.strip() == 'comprehensive-tests = []']
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one no-op comprehensive-tests feature, found {len(matches)}')
              index = matches[0]
              del lines[index]
              if index > 0 and lines[index - 1].lstrip().startswith('#') and any(
                  token in lines[index - 1].lower()
                  for token in ('no-op', 'ci-mutants', 'comprehensive-tests', 'uniform')
              ):
                  del lines[index - 1]
              path.write_text(''.join(lines), encoding='utf-8')

          registry_path = Path('docs/stability/surface-registry.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          observed = set()
          for package in registry['packages']:
              if package['name'] not in package_names:
                  continue
              before = package.get('features', [])
              matches = [feature for feature in before if feature.get('name') == 'comprehensive-tests']
              if len(matches) != 1:
                  raise SystemExit(
                      f"registry {package['name']}: expected exactly one comprehensive-tests feature, found {len(matches)}"
                  )
              package['features'] = [
                  feature for feature in before
                  if feature.get('name') != 'comprehensive-tests'
              ]
              observed.add(package['name'])
          if observed != package_names:
              missing = sorted(package_names - observed)
              raise SystemExit(f'registry package coverage mismatch: {missing}')
          registry_path.write_text(json.dumps(registry, indent=2) + '\n', encoding='utf-8')

          justfile = Path('justfile')
          text = justfile.read_text(encoding='utf-8')
          old = 'cargo llvm-cov --all-features --workspace --exclude copybook-bench --exclude copybook-bdd --lcov --output-path lcov.info'
          new = 'cargo llvm-cov --workspace --exclude copybook-bench --exclude copybook-bdd --lcov --output-path lcov.info'
          if text.count(old) != 1:
              raise SystemExit('unexpected local coverage recipe')
          justfile.write_text(text.replace(old, new), encoding='utf-8')

          doc = Path('docs/architecture/TEST_CAPABILITIES.md')
          doc.parent.mkdir(parents=True, exist_ok=True)
          if doc.exists():
              raise SystemExit(f'{doc} already exists unexpectedly')
          doc.write_text('''<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
          # Test capability ownership

          Repository validation selects real capabilities deliberately. It does not add no-op Cargo features merely so one command can be applied to every package.

          | Capability | Owner | Normal lane | Contract |
          | --- | --- | --- | --- |
          | Default stable tests | whole workspace | blocking PR/main | Advertised stable behavior and normal package defaults |
          | Comprehensive parser scenarios | `copybook-core` | dedicated advisory/opt-in | Aspirational and extended parser scenarios behind the real `comprehensive-tests` feature |
          | Comprehensive codec scenarios | `copybook-codec` | dedicated advisory/opt-in | Extended ODO, REDEFINES, RDW, and numeric scenarios behind the real `comprehensive-tests` feature |
          | BDD | `copybook-bdd` | dedicated BDD lane | Cucumber harness, not a nextest-compatible ordinary test target |
          | Property tests | `copybook-proptest` plus owner integration tests | dedicated property lane | Governed seeds, case counts, and committed regressions |
          | Fuzzing | standalone `fuzz/` workspace | fuzz integration/dispatch | Owner-targeted fuzz binaries, not runtime feature flags |
          | RIPR | repository control plane | advisory PR/weekly | Diff-scoped test-oracle work orders |
          | cargo-mutants | local deliberate tooling | `just mutants` | Not a routine hosted-CI capability |
          | Arrow, audit, and metrics | owning adapter/application | dedicated feature lanes | Optional product or operational surfaces, not stable-default proof |

          Only `copybook-core` and `copybook-codec` own the `comprehensive-tests` Cargo feature because those packages contain tests gated by it. Coverage and the normal PR gate use default product features; comprehensive and experimental surfaces run in explicitly named lanes.

          Removing a no-op feature from a publishable package is an intentional next-release surface cleanup. It must not be represented as a 0.5 patch-release compatibility promise.
          '''.replace('          ', ''), encoding='utf-8')

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          anchor = '(`mutants.toml`) is local-only via `just mutants`. Scheduled lanes can be'
          replacement = '(`mutants.toml`) is local-only via `just mutants`. Test capabilities are owner-specific; do not add no-op Cargo features for uniform CI loops (see `docs/architecture/TEST_CAPABILITIES.md`). Scheduled lanes can be'
          if text.count(anchor) != 1:
              raise SystemExit('unexpected AGENTS.md mutation-testing paragraph')
          agents.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

          python3 -m json.tool docs/stability/surface-registry.json >/dev/null
          git diff --check
      - name: Prove real capability ownership
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps > /tmp/metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.load(open('/tmp/metadata.json', encoding='utf-8'))
          by_name = {package['name']: package for package in metadata['packages']}
          owners = sorted(
              name for name, package in by_name.items()
              if 'comprehensive-tests' in package.get('features', {})
          )
          if owners != ['copybook-codec', 'copybook-core']:
              raise SystemExit(f'unexpected comprehensive feature owners: {owners}')

          registry = json.loads(Path('docs/stability/surface-registry.json').read_text(encoding='utf-8'))
          registry_owners = sorted(
              package['name']
              for package in registry['packages']
              if any(feature.get('name') == 'comprehensive-tests' for feature in package.get('features', []))
          )
          if registry_owners != owners:
              raise SystemExit(
                  f'manifest/registry comprehensive feature mismatch: manifests={owners}, registry={registry_owners}'
              )
          PY
          cargo check -p copybook-core --features comprehensive-tests --tests
          cargo check -p copybook-codec --features comprehensive-tests --tests
          cargo test -p xtask docs_verify::tests::verify_stability_registry_matches_current_workspace
          cargo fmt --all -- --check
          git diff --check
      - name: Commit capability cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -- ':!.github/workflows/apply-669-capabilities.yml'
          if git diff --cached --quiet; then
            echo 'Capability cleanup already applied.'
            exit 0
          fi
          git commit -m "ci: make test capability selection owner-aware"
          git pull --rebase origin codex/646-capability-aware-ci
          git push origin HEAD:codex/646-capability-aware-ci
