# SPDX-License-Identifier: AGPL-3.0-or-later
name: Restore 667 dated baseline provenance

on:
  push:
    branches:
      - codex/642-rust-1-95-v2

permissions:
  contents: write

concurrency:
  group: restore-667-dated-baseline
  cancel-in-progress: true

jobs:
  restore-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/642-rust-1-95-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Restore dated measurement provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/panic-elimination-domain-schemas.md')
          text = path.read_text(encoding='utf-8')
          old = '''  "performance_baseline": {
            "measurement_date": "2025-09-27T00:00:00Z",
            "environment": {
              "rust_version": "1.95+",
              "target_triple": "x86_64-unknown-linux-gnu",
          '''.replace('          ', '')
          new = old.replace('"rust_version": "1.95+"', '"rust_version": "1.92+"')
          if text.count(old) != 1:
              raise SystemExit('unexpected dated performance baseline block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo test -p copybook-bench --test diagnostics
          git diff --check
      - name: Commit provenance correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add docs/panic-elimination-domain-schemas.md
          git commit -m "docs(msrv): preserve dated baseline provenance"
          git push origin HEAD:codex/642-rust-1-95-v2
