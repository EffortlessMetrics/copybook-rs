# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
members = [
    "crates/copybook-error",
    "crates/copybook-error-reporter",
    "crates/copybook-utils",
    "crates/copybook-zoned-format",
    "crates/copybook-overflow",
    "crates/copybook-fixed",
    "crates/copybook-rdw",
    "crates/copybook-record-io",
    "crates/copybook-overpunch",
    "crates/copybook-determinism",
    "crates/copybook-codepage",
    "crates/copybook-charset",
    "crates/copybook-lexer",
    "crates/copybook-options",
    "crates/copybook-core",
    "crates/copybook-corruption",
    "crates/copybook-corruption-detectors",
    "crates/copybook-corruption-rdw",
    "crates/copybook-corruption-predicates",
    "crates/copybook-dialect",
    "crates/copybook-codec",
    "crates/copybook-codec-memory",
    "crates/copybook-sequence-ring",
    "crates/copybook-safe-ops",
    "crates/copybook-rdw-predicates",
    "crates/copybook-safe-index",
    "crates/copybook-safe-text",
    "crates/copybook-cli",
    "crates/copybook-cli-determinism",
    "crates/copybook-governance",
    "crates/copybook-governance-grid",
    "crates/copybook-governance-runtime",
    "crates/copybook-governance-contracts",
    "crates/copybook-arrow",
    "crates/copybook-contracts",
    "crates/copybook-support-matrix",
    "tools/copybook-gen",
    "tools/copybook-bench",
    "tools/copybook-scripts",
    "tools/xtask",
    "tests/bdd",
    "tests/proptest",
    "tests/e2e",
]
exclude = [
    "examples/kafka_pipeline",
]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.93" # MSRV (validated in .github/workflows/ci.yml and policy/clippy-lints.toml)
license = "AGPL-3.0-or-later"
authors = ["Steven Zimmerman, CPA <git@effortlesssteven.com>"]
repository = "https://github.com/EffortlessMetrics/copybook-rs"
homepage = "https://github.com/EffortlessMetrics/copybook-rs"
description = "Rust toolkit for COBOL copybook parsing and deterministic fixed-record conversion (EBCDIC/ASCII <-> JSON)"
keywords = ["cobol", "copybook", "mainframe", "ebcdic", "etl"]
categories = ["parsing", "encoding", "command-line-utilities"]

[workspace.dependencies]
# Internal workspace crates (pin exact versions for publish)
copybook-error = { version = "=0.4.3", path = "crates/copybook-error" }
copybook-error-reporter = { version = "=0.4.3", path = "crates/copybook-error-reporter" }
copybook-utils = { version = "=0.4.3", path = "crates/copybook-utils" }
copybook-overflow = { version = "=0.4.3", path = "crates/copybook-overflow" }
copybook-zoned-format = { version = "=0.4.3", path = "crates/copybook-zoned-format" }
copybook-fixed = { version = "=0.4.3", path = "crates/copybook-fixed" }
copybook-rdw = { version = "=0.4.3", path = "crates/copybook-rdw" }
copybook-record-io = { version = "=0.4.3", path = "crates/copybook-record-io" }
copybook-overpunch = { version = "=0.4.3", path = "crates/copybook-overpunch" }
copybook-determinism = { version = "=0.4.3", path = "crates/copybook-determinism" }
copybook-safe-ops = { version = "=0.4.3", path = "crates/copybook-safe-ops" }
copybook-safe-text = { version = "=0.4.3", path = "crates/copybook-safe-text" }
copybook-safe-index = { version = "=0.4.3", path = "crates/copybook-safe-index" }
copybook-rdw-predicates = { version = "=0.4.3", path = "crates/copybook-rdw-predicates" }
copybook-codepage = { version = "=0.4.3", path = "crates/copybook-codepage" }
copybook-charset = { version = "=0.4.3", path = "crates/copybook-charset" }
copybook-options = { version = "=0.4.3", path = "crates/copybook-options" }
copybook-lexer = { version = "=0.4.3", path = "crates/copybook-lexer" }
copybook-core = { version = "=0.4.3", path = "crates/copybook-core" }
copybook-corruption = { version = "=0.4.3", path = "crates/copybook-corruption" }
copybook-corruption-detectors = { version = "=0.4.3", path = "crates/copybook-corruption-detectors" }
copybook-corruption-rdw = { version = "=0.4.3", path = "crates/copybook-corruption-rdw" }
copybook-corruption-predicates = { version = "=0.4.3", path = "crates/copybook-corruption-predicates" }
copybook-dialect = { version = "=0.4.3", path = "crates/copybook-dialect" }
copybook-codec = { version = "=0.4.3", path = "crates/copybook-codec" }
copybook-codec-memory = { version = "=0.4.3", path = "crates/copybook-codec-memory" }
copybook-cli-determinism = { version = "=0.4.3", path = "crates/copybook-cli-determinism" }
copybook-sequence-ring = { version = "=0.4.3", path = "crates/copybook-sequence-ring" }
copybook-arrow = { version = "=0.4.3", path = "crates/copybook-arrow" }
copybook-governance = { version = "=0.4.3", path = "crates/copybook-governance" }
copybook-governance-grid = { version = "=0.4.3", path = "crates/copybook-governance-grid" }
copybook-governance-runtime = { version = "=0.4.3", path = "crates/copybook-governance-runtime" }
copybook-governance-contracts = { version = "=0.4.3", path = "crates/copybook-governance-contracts" }
copybook-bench = { version = "=0.4.3", path = "tools/copybook-bench" }
copybook-contracts = { version = "=0.4.3", path = "crates/copybook-contracts" }
copybook-support-matrix = { version = "=0.4.3", path = "crates/copybook-support-matrix" }

# Core dependencies
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_plain = "1.0.2"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Memory management dependencies
smallvec = "1.15.1"
crossbeam-channel = "0.5.15"
indexmap = { version = "2.13.0", features = ["serde"] }

# CLI dependencies
clap = { version = "4.5.60", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
tempfile = "3.26.0"

# Telemetry dependencies
metrics = "0.24.3"

# Parsing dependencies
logos = "0.16.1"
regex = "1.12.3"

# Crypto dependencies
sha2 = "0.10.9"
base64 = "0.22.1"
blake3 = "1.8.3"

# Testing dependencies
proptest = "1.10.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
hex = "0.4.3"
assert_cmd = "2.1.2"
predicates = "3.1.4"
num_cpus = "1.17.0"
roxmltree = "0.21.1"

# BDD testing dependencies
cucumber = "0.22.1"
futures = "0.3.32"

# Task automation dependencies
anyhow = "1.0.102"

# Random number generation dependencies
rand = "0.10.0"
rand_core = "0.10.0"

# Enterprise audit dependencies
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }

# TOML parsing
toml = "0.9.8"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"

[profile.dev]
debug = true
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unexpected_cfgs = "warn"
const_item_interior_mutations = "deny"
function_casts_as_integer = "deny"

[workspace.lints.clippy]
# Panic-free production and tests
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
unreachable = "deny"
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
indexing_slicing = "deny"
out_of_bounds_indexing = "deny"
unchecked_time_subtraction = "deny"

# AST / parser / UTF-8 / slice safety
char_indices_as_byte_indices = "deny"
sliced_string_as_bytes = "deny"
index_refutable_slice = "deny"

# Silent failure
let_underscore_future = "deny"
let_underscore_must_use = "deny"
let_underscore_lock = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
lines_filter_map_ok = "deny"

# Async / concurrency
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
future_not_send = "warn"
large_futures = "warn"
arc_with_non_send_sync = "deny"
rc_mutex = "deny"
mut_mutex_lock = "deny"
readonly_write_lock = "deny"

# Unsafe / memory
mem_forget = "deny"
forget_non_drop = "deny"
drop_non_drop = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
repr_packed_without_abi = "deny"

# Numeric correctness
float_cmp = "deny"
float_cmp_const = "deny"
float_equality_without_abs = "deny"
lossy_float_literal = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
invalid_upcast_comparisons = "deny"
cast_abs_to_unsigned = "deny"
cast_enum_truncation = "deny"
cast_nan_to_int = "deny"
manual_midpoint = "warn"
manual_is_multiple_of = "warn"
manual_div_ceil = "warn"
arithmetic_side_effects = "warn"

# File/process/path footguns
suspicious_open_options = "deny"
nonsensical_open_options = "deny"
ineffective_open_options = "deny"
path_buf_push_overwrite = "deny"
join_absolute_paths = "deny"
read_line_without_trim = "warn"
exit = "deny"

# API / trait correctness
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"
fallible_impl_from = "deny"
error_impl_error = "deny"
result_unit_err = "warn"
result_large_err = "warn"

# Good taste that pays rent
format_in_format_args = "deny"
to_string_in_format_args = "deny"
unused_format_specs = "deny"
unnecessary_debug_formatting = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_strip = "warn"
manual_split_once = "warn"
manual_is_variant_and = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
match_result_ok = "deny"
cloned_instead_of_copied = "warn"
iter_cloned_collect = "warn"
iter_overeager_cloned = "warn"
needless_collect = "warn"
redundant_closure = "warn"
redundant_closure_for_method_calls = "warn"
missing_panics_doc = "deny"
missing_errors_doc = "warn"

# Suppression governance
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
blanket_clippy_restriction_lints = "deny"
ignore_without_reason = "deny"
should_panic_without_expect = "deny"
