# SPDX-License-Identifier: AGPL-3.0-or-later
name: Refine issue 641 boundary schema

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/641-package-roles
          fetch-depth: 0

      - name: Complete deterministic boundary evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('docs/stability/surface-registry.json')
          registry = json.loads(path.read_text(encoding='utf-8'))

          primary_reasons = {
              'copybook': 'A module cannot provide the canonical crates.io dependency, documentation front door, and stable assembly surface.',
              'copybook-rs': 'A module cannot reserve the repository-name crates.io search path or preserve package-name compatibility.',
              'copybook-core': 'Independent parser/schema adopters need this engine without the codec, CLI, or adapter dependency closure.',
              'copybook-codec': 'Embedded conversion users need the record runtime independently of the CLI and optional adapters.',
              'copybook-error': 'Multiple independent public packages require one shared error type identity without depending upward on an engine.',
              'copybook-charset': 'Codepage conversion is an independently useful external-format boundary with a small dependency closure.',
              'copybook-fixed': 'Conditional: a package is justified only if schema-independent fixed-LRECL users and proof survive #650.',
              'copybook-rdw': 'Conditional: a package is justified only if schema-independent RDW users and proof survive #651.',
              'copybook-cli': 'The installable binary and process boundary requires its own Cargo package.',
              'copybook-arrow': 'The optional Arrow/Parquet ecosystem and heavy dependency closure must remain isolated from normal users.',
              'copybook-governance': 'Conditional: only a real external beta integration contract can justify a package rather than application modules.',
              'copybook-support-matrix': 'Conditional: only a complete externally consumed machine contract can justify a package rather than repository data.',
          }

          for package in registry['packages']:
              boundary = package['boundary']
              name = package['name']
              role = boundary['role']
              owner = boundary['true_owner']

              boundary['stability_class'] = package['class']
              if name == 'copybook-rs':
                  direction = 'depends-only-on-copybook'
              elif name == 'copybook-core':
                  direction = 'leafward-only:no-codec-cli-adapter-or-governance-runtime'
              elif name == 'copybook-error':
                  direction = 'shared-leaf:no-copybook-product-dependencies'
              elif name in {'copybook-charset', 'copybook-fixed', 'copybook-rdw'}:
                  direction = 'edge-leaf:no-core-codec-cli-framework-or-governance'
              elif role == 'primary' and name == 'copybook-cli':
                  direction = 'application-depends-inward-on-public-library-seams'
              elif role in {'adapter', 'contract'}:
                  direction = 'outer-surface-depends-inward-never-owned-by-core'
              elif role == 'compat':
                  direction = 'depends-only-on-true-owner;never-consumed-by-primary'
              elif role == 'retiring':
                  direction = 'no-primary-consumers-after-owner-migration'
              elif role == 'internal-tool':
                  direction = 'may-depend-on-product;never-consumed-by-product'
              else:
                  direction = 'facade-depends-only-on-intentional-public-owners'
              boundary['dependency_direction'] = direction

              if name in primary_reasons:
                  boundary['module_insufficiency_reason'] = primary_reasons[name]
              elif role == 'compat':
                  boundary['module_insufficiency_reason'] = 'Temporary package retention is required only because this crates.io name was already published; implementation belongs under the true owner.'
              elif role == 'retiring':
                  boundary['module_insufficiency_reason'] = 'None: a module under the true owner is sufficient, so this package leaves the primary graph.'
              elif role == 'internal-tool':
                  boundary['module_insufficiency_reason'] = 'A separate binary or test-harness dependency closure keeps tooling out of shipped product packages.'
              else:
                  boundary['module_insufficiency_reason'] = 'Conditional boundary; retain only when external contract evidence proves a module is insufficient.'

              if package['publish'] and not boundary.get('external_user_story'):
                  if role == 'compat':
                      boundary['external_user_story'] = f'Migrate existing 0.5 users of {name} to {owner} without yanking the published package name.'
                  elif role == 'retiring':
                      boundary['external_user_story'] = f'No new direct adoption; keep the 0.5 artifact resolvable while implementation and primary consumers move to {owner}.'
                  else:
                      boundary['external_user_story'] = f'Consume the documented {name} surface according to its current {package["class"]} stability class.'

              if package['publish'] and not boundary.get('invariant_owned'):
                  if role == 'compat':
                      boundary['invariant_owned'] = 'Forwarding parity with the true owner and no independent implementation.'
                  elif role == 'retiring':
                      boundary['invariant_owned'] = 'No new implementation and no dependency from primary packages while the old artifact remains available.'
                  elif role in {'adapter', 'contract'}:
                      boundary['invariant_owned'] = 'Outer contract remains isolated from core ownership and matches its documented stability class.'
                  else:
                      boundary['invariant_owned'] = 'Published behavior remains aligned with its documented owner and stability contract.'

              if name == 'copybook-rdw':
                  boundary['target_disposition'] = 'conditional'
                  boundary['compatibility_plan'] = 'retain-only-if-schema-independent-direct-use-proof-passes-issue-651'
              if name == 'copybook-fixed':
                  boundary['target_disposition'] = 'conditional'
                  boundary['compatibility_plan'] = 'retain-only-if-schema-independent-direct-use-proof-passes-issue-650'

          path.write_text(json.dumps(registry, indent=2) + '\n', encoding='utf-8')

          policy = Path('docs/architecture/PACKAGE_BOUNDARIES.md')
          text = policy.read_text(encoding='utf-8')
          old = 'A retained public package must name an external user story, its invariant, its dependency direction, its stability class, and why a module is insufficient.'
          new = old + ' Compatibility and retiring package names must instead state their finite migration story, forwarding/no-new-implementation invariant, and why package retention is temporary.'
          if new not in text:
              if old not in text:
                  raise SystemExit('package-boundary evidence paragraph changed unexpectedly')
              text = text.replace(old, new, 1)
          old_target = '`copybook-rdw`, `copybook-cli`, and `copybook-arrow`. `copybook-fixed` remains conditional'
          new_target = '`copybook-cli`, and `copybook-arrow`. Both `copybook-rdw` and `copybook-fixed` remain conditional'
          if new_target not in text:
              if old_target not in text:
                  raise SystemExit('package-boundary target paragraph changed unexpectedly')
              text = text.replace(old_target, new_target, 1)
          policy.write_text(text, encoding='utf-8')
          PY

          python3 -m json.tool docs/stability/surface-registry.json >/dev/null
          git diff --check

      - name: Commit refined registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add docs/stability/surface-registry.json docs/architecture/PACKAGE_BOUNDARIES.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(architecture): complete package boundary evidence"
          git push origin HEAD:codex/641-package-roles
