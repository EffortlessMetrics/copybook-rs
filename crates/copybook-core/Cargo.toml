# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "copybook-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core COBOL copybook parser, schema, and validation primitives."
documentation = "https://docs.rs/copybook-core"
readme = "README.md"
keywords = ["cobol", "copybook", "mainframe", "ebcdic", "parser"]
categories = ["parsing", "data-structures", "encoding"]

# Keep tarballs slim; whitelist essential files
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "!**/claude.md"]

[package.metadata.docs.rs]
all-features = false
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
copybook-error.workspace = true
copybook-error-reporter.workspace = true
copybook-overflow.workspace = true
copybook-utils.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_plain.workspace = true
thiserror.workspace = true
tracing.workspace = true
logos.workspace = true
sha2.workspace = true
copybook-governance-contracts.workspace = true

[dev-dependencies]
anyhow.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }

[features]
default = []
# Enables comprehensive parser fixtures in tests (opt-in, not for docs.rs).
comprehensive-tests = []

[lints]
workspace = true
