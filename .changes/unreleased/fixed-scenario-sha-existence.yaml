kind: fixed
body: '**evidence**: scenario-ledger SHAs must resolve to commits (#981).
  `last_verified_full_sha` was syntax-checked only, so an invented SHA
  passed and five rows cited squash-orphaned branch heads. The
  verifier now resolves each SHA to a commit object (existence only, never
  ancestry, so equivalent content survives squash/rebase), reports
  explicitly unavailable in shallow checkouts instead of silently passing,
  and the five dead rows were re-verified anchor-by-anchor against main.'
