kind: added
body: '**inspect**: static ownership queries answer which field owns a
  payload-relative byte (`--payload-byte N`) or which byte range backs a
  field path (`--field PATH`, full dotted path or a unique short name,
  case-insensitive). Queries run over a `--manifest` document or a
  copybook/profile pair through the same manifest constructor, so both
  inputs answer byte-identically; `--output json` emits the same typed
  answer as machine output with fingerprints and no local paths. Fixed
  OCCURS bytes resolve to the true within-occurrence child with its
  occurrence index, ODO occurrences at or past the minimum report
  `possible` presence, REDEFINES bytes report one storage owner plus
  views, and RENAMES aliases and Level-88 relationships are reported
  truthfully. Unknown and ambiguous paths fail closed with exit 3
  (subcodes 407/408); answered states, including `gap` and `out_of_range`,
  exit 0. Manifest wire items gain optional OCCURS repetition bounds;
  scalar-only manifests re-serialize byte-identically.'
