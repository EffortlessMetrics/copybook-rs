# SPDX-License-Identifier: AGPL-3.0-or-later
name: Bootstrap issue 641

on:
  push:
    branches:
      - codex/641-package-roles
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  classify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/641-package-roles
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Encode package roles and ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          registry_path = Path("docs/stability/surface-registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))

          primary = {
              "copybook": ("facade", "copybook", "Use the canonical copybook-rs library API without learning the workspace topology.", "copybook"),
              "copybook-rs": ("facade", "copybook", "Find the project by its repository name and receive the canonical copybook API unchanged.", "copybook"),
              "copybook-core": ("engine", "copybook-core", "Parse, validate, inspect, project, and lay out COBOL copybooks without processing record files.", "copybook::core"),
              "copybook-codec": ("engine", "copybook-codec", "Decode and encode COBOL records through an embeddable deterministic runtime.", "copybook::codec"),
              "copybook-error": ("shared-leaf", "copybook-error", "Share stable error identities and structured context across independent public packages.", "copybook::error"),
              "copybook-charset": ("external-format", "copybook-charset", "Convert supported EBCDIC codepages and Unicode without pulling in parser or codec layers.", "copybook::charset"),
              "copybook-rdw": ("external-format", "copybook-rdw", "Read and write RDW-framed streams independently after schema coupling is removed.", "copybook::framing::rdw"),
              "copybook-fixed": ("external-format", "copybook-fixed", "Read and write fixed-LRECL streams independently if the schema-independent boundary is proven.", "copybook::framing::fixed"),
              "copybook-cli": ("application", "copybook-cli", "Install and run the copybook command-line application.", None),
              "copybook-arrow": ("adapter", "copybook-arrow", "Opt into Arrow and Parquet conversion without imposing those dependencies on core users.", None),
          }

          conditional = {
              "copybook-governance": ("adapter", "copybook-governance", "Consume governance/support policy as one optional beta integration surface if external adopters need it."),
              "copybook-support-matrix": ("contract", "copybook-support-matrix", "Consume a complete authoritative machine-readable support contract if that external use case is proven."),
          }

          collapse_owner = {
              "copybook-error-reporter": "split:copybook-error,copybook-core,copybook-codec,copybook-cli",
              "copybook-utils": "split:copybook-core,copybook-codec,copybook-fixed,copybook-rdw",
              "copybook-zoned-format": "copybook-codec",
              "copybook-overflow": "split:copybook-core,copybook-codec,copybook-fixed,copybook-rdw",
              "copybook-record-io": "copybook-codec",
              "copybook-overpunch": "copybook-codec",
              "copybook-determinism": "copybook-codec",
              "copybook-codepage": "copybook-charset",
              "copybook-lexer": "copybook-core",
              "copybook-options": "split:copybook-codec,copybook-charset,copybook-cli",
              "copybook-corruption": "split:copybook-codec,copybook-rdw",
              "copybook-corruption-detectors": "copybook-codec",
              "copybook-corruption-rdw": "copybook-rdw",
              "copybook-corruption-predicates": "split:copybook-codec,copybook-rdw",
              "copybook-dialect": "copybook-core",
              "copybook-codec-memory": "copybook-codec",
              "copybook-sequence-ring": "copybook-codec",
              "copybook-safe-ops": "split:copybook-core,copybook-codec,copybook-fixed,copybook-rdw",
              "copybook-rdw-predicates": "copybook-rdw",
              "copybook-safe-index": "split:copybook-core,copybook-codec,copybook-fixed,copybook-rdw",
              "copybook-safe-text": "split:copybook-core,copybook-codec",
              "copybook-cli-determinism": "copybook-cli",
              "copybook-governance-grid": "copybook-governance",
              "copybook-governance-runtime": "copybook-governance",
              "copybook-governance-contracts": "copybook-governance",
              "copybook-contracts": "split:copybook-core,copybook-codec,copybook-cli,copybook-governance",
          }

          tools = {
              "copybook-gen": "tooling",
              "copybook-bench": "harness",
              "copybook-scripts": "tooling",
              "xtask": "tooling",
              "copybook-bdd": "harness",
              "copybook-proptest": "harness",
              "copybook-e2e": "harness",
          }

          stable_or_facade_exposed = {
              "copybook-error-reporter",
              "copybook-record-io",
              "copybook-overpunch",
              "copybook-determinism",
              "copybook-codepage",
              "copybook-options",
              "copybook-contracts",
              "copybook-lexer",
              "copybook-dialect",
          }

          seen = set()
          for package in registry["packages"]:
              name = package["name"]
              seen.add(name)
              if name in primary:
                  seam_type, owner, story, facade_path = primary[name]
                  role = "alias" if name == "copybook-rs" else ("adapter" if name == "copybook-arrow" else "primary")
                  disposition = "keep"
                  compatibility = "permanent-alias" if name == "copybook-rs" else "retained-primary-package"
              elif name in conditional:
                  seam_type, owner, story = conditional[name]
                  role = "adapter" if name == "copybook-governance" else "contract"
                  disposition = "conditional"
                  compatibility = "retain-only-if-external-contract-is-proven"
                  facade_path = None
              elif name in collapse_owner:
                  owner = collapse_owner[name]
                  seam_type = "orchestration" if any(token in name for token in ("runtime", "record-io", "reporter", "governance")) else "utility"
                  story = None
                  role = "compat" if name in stable_or_facade_exposed else "retiring"
                  disposition = "collapse"
                  compatibility = (
                      "implementation-free-forwarder-through-0.6-with-finite-window"
                      if role == "compat"
                      else "leave-0.5.0-available-and-stop-publishing-after-primary-consumers-move"
                  )
                  facade_path = None
              elif name in tools:
                  role = "internal-tool"
                  seam_type = tools[name]
                  owner = name
                  story = None
                  disposition = "keep-internal"
                  compatibility = "not-published"
                  facade_path = None
              else:
                  raise SystemExit(f"missing package-boundary classification for {name}")

              package["boundary"] = {
                  "role": role,
                  "seam_type": seam_type,
                  "true_owner": owner,
                  "external_user_story": story,
                  "invariant_owned": {
                      "copybook": "curated canonical API composition",
                      "copybook-rs": "exact redirect parity with copybook",
                      "copybook-core": "validated deterministic schema and layout construction",
                      "copybook-codec": "byte-faithful deterministic bidirectional record processing",
                      "copybook-error": "stable machine-readable error identity",
                      "copybook-charset": "exact codepage conversion and policy",
                      "copybook-rdw": "bounded correct RDW framing",
                      "copybook-fixed": "bounded correct fixed-LRECL framing",
                      "copybook-cli": "documented command, output, and process-exit behavior",
                      "copybook-arrow": "isolated Arrow/Parquet adapter behavior",
                  }.get(name),
                  "preferred_facade_path": facade_path,
                  "target_disposition": disposition,
                  "compatibility_plan": compatibility,
                  "consumer_data": "generated-from-cargo-metadata-by-issue-644",
              }

          expected = set(primary) | set(conditional) | set(collapse_owner) | set(tools)
          if seen != expected:
              missing = sorted(expected - seen)
              extra = sorted(seen - expected)
              raise SystemExit(f"registry/workspace classification mismatch; missing={missing}, extra={extra}")

          registry_path.write_text(json.dumps(registry, indent=2) + "\n", encoding="utf-8")

          policy = Path("docs/architecture/PACKAGE_BOUNDARIES.md")
          policy.parent.mkdir(parents=True, exist_ok=True)
          policy.write_text("""<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
          # Package boundaries

          `copybook-rs` designs implementation seams aggressively but publishes packages conservatively. A Cargo package is a distribution and compatibility promise, not merely a convenient folder.

          ## Decision rule

          A production seam remains a published package only when it is one of:

          1. a canonical product or application entrypoint;
          2. an independently useful domain engine;
          3. a shared leaf required by multiple surviving public packages without dependency inversion;
          4. a real external-format or ecosystem adapter;
          5. the permanent `copybook-rs` search alias; or
          6. a finite compatibility package during an already-published migration.

          Single-owner implementation seams remain explicit module families under their true owner. They keep focused folders, narrow visibility, invariant tests, fuzz/property targets, and review ownership without retaining a separate `Cargo.toml` or crates.io support promise.

          ## Required package evidence

          A retained public package must name an external user story, its invariant, its dependency direction, its stability class, and why a module is insufficient. The authoritative decisions live in `docs/stability/surface-registry.json` under each package's `boundary` object. Consumer and publish-closure data are generated from Cargo metadata by the architecture checker tracked in #644.

          ## Migration rules

          - Never yank 0.5.0 artifacts.
          - Primary packages never depend on forwarding packages.
          - Ownership moves and behavior corrections use separate PRs whenever practical.
          - Compatibility packages contain only re-exports, deprecations, migration documentation, and compile-contract tests.
          - Deep packages already classified internal-only receive no automatic forwarding release; they remain available at 0.5.0 and stop receiving versions once primary consumers move.
          - `copybook-rs` remains a permanent alias containing only `pub use copybook::*;`.

          ## Working primary family for 0.6.0

          The current target is `copybook`, `copybook-rs`, `copybook-core`, `copybook-codec`, `copybook-error`, `copybook-charset`, `copybook-rdw`, `copybook-cli`, and `copybook-arrow`. `copybook-fixed` remains conditional on a schema-independent direct-use proof. Governance and support-matrix packages remain conditional rather than being promoted by topology alone.
          """.replace("          ", ""), encoding="utf-8")

          stability = Path("docs/STABILITY_GUARANTEES.md")
          text = stability.read_text(encoding="utf-8")
          marker = "## Package-boundary metadata"
          if marker not in text:
              insertion = """

          ## Package-boundary metadata

          The surface registry also records each package's architectural role, true semantic owner, preferred facade path, target disposition, and 0.5 compatibility policy. See [Package boundaries](architecture/PACKAGE_BOUNDARIES.md). These fields describe the v0.6 convergence target; the existing package-level stability class remains authoritative until the corresponding ownership PR merges.
          """.replace("          ", "")
              text = text.replace("## What May Change", insertion + "\n## What May Change")
              stability.write_text(text, encoding="utf-8")
          PY

          python3 -m json.tool docs/stability/surface-registry.json >/dev/null

      - name: Validate source truth
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p xtask
          cargo run -p xtask -- docs verify-all
          git diff --check

      - name: Commit classification and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-641.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "docs(architecture): define package roles and true owners"
          git push origin HEAD:codex/641-package-roles
