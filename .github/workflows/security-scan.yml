# SPDX-License-Identifier: AGPL-3.0-or-later
name: Security (weekly)

# Canonical owner for raw audit artifacts and the findings roll-up issue.
# ci-security.yml remains the minimal weekly cargo-deny/cargo-audit policy gate.

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discover and plan without mutating GitHub issues/comments"
        required: false
        default: true
        type: boolean

concurrency:
  group: security-weekly-lifecycle
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  weekly-audit:
    name: Weekly Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: advisory-db

      - name: Install cargo-deny
        run: cargo install cargo-deny@0.19.0 --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo deny check
        id: deny
        continue-on-error: true
        run: |
          set +e
          cargo deny check --config deny.toml
          deny_status=$?
          set -e
          echo "exit_status=${deny_status}" >> "$GITHUB_OUTPUT"
          exit "${deny_status}"

      - name: Run cargo audit
        id: audit
        if: always()
        # cargo audit exits 1 on warnings (e.g. unmaintained crates) AND
        # vulnerabilities. Capture JSON regardless; continue-on-error lets
        # the issue step below report actual vulnerabilities.
        continue-on-error: true
        run: |
          mkdir -p target
          set +e
          cargo audit -q --json > target/security.audit.json
          audit_status=$?
          set -e
          echo "exit_status=${audit_status}" >> "$GITHUB_OUTPUT"
          exit "${audit_status}"

      - name: Classify raw cargo-audit output
        id: classify
        if: always()
        run: |
          python3 scripts/ci/classify_security_audit.py \
            classify \
            target/security.audit.json \
            --audit-exit-status "${{ steps.audit.outputs.exit_status }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload raw cargo-audit output
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-raw-${{ github.run_id }}
          path: target/security.audit.json
          retention-days: 90
          if-no-files-found: error

      - name: Plan and optionally execute roll-up lifecycle
        id: lifecycle
        if: steps.upload.outcome == 'success' && steps.classify.outcome == 'success' && steps.classify.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/ci/security_issue_lifecycle_adapter.mjs \
            --state "${{ steps.classify.outputs.state }}" \
            --finding-count "${{ steps.classify.outputs.finding_count }}" \
            --findings-fingerprint "${{ steps.classify.outputs.findings_fingerprint }}" \
            --artifact-name "cargo-audit-raw-${{ github.run_id }}" \
            --eligible "${{ steps.classify.outputs.eligible }}" \
            --dry-run "${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}"

      - name: Enforce audit and lifecycle outcome
        if: always()
        run: |
          python3 scripts/ci/classify_security_audit.py enforce \
            --deny-exit-status "${{ steps.deny.outputs.exit_status }}" \
            --audit-exit-status "${{ steps.audit.outputs.exit_status }}" \
            --classification-outcome "${{ steps.classify.outcome }}" \
            --decision "${{ steps.classify.outputs.decision }}"
          if [ "${{ steps.upload.outcome }}" != "success" ]; then
            echo "raw audit artifact upload failed"
            exit 1
          fi
          if [ "${{ steps.classify.outputs.eligible }}" = "true" ] && [ "${{ steps.lifecycle.outcome }}" != "success" ]; then
            echo "eligible lifecycle did not complete"
            exit 1
          fi
