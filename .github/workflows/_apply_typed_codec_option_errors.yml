# SPDX-License-Identifier: AGPL-3.0-or-later
name: Apply typed codec option errors

on:
  push:
    branches:
      - api/typed-codec-option-errors-20260906

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: api/typed-codec-option-errors-20260906
          fetch-depth: 0

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply bounded source change
        env:
          BASE_SHA: ce20efea0b4eb12fbc8b1e57e3471800cd0ea4ba
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          python3 .github/scripts/_apply_typed_codec_option_errors.py

      - name: Format
        run: cargo +1.95.0 fmt --all

      - name: Focused codec contract tests
        run: |
          cargo +1.95.0 test -p copybook-codec --test option_parse_errors
          cargo +1.95.0 test -p copybook-options --test parse_error_compat
          cargo +1.95.0 test -p copybook-codec --lib options::

      - name: Focused Clippy
        run: |
          cargo +1.95.0 clippy -p copybook-codec --lib -- -D warnings -W clippy::pedantic
          cargo +1.95.0 clippy -p copybook-codec --test option_parse_errors -- -D warnings -W clippy::pedantic
          cargo +1.95.0 clippy -p copybook-options --test parse_error_compat -- -D warnings -W clippy::pedantic

      - name: Documentation and diff controls
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 run -p xtask -- docs verify-all
          cargo +1.95.0 test -p copybook-codec --doc
          git diff --check
          actual="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            crates/copybook-codec/src/lib.rs \
            crates/copybook-codec/src/options.rs \
            crates/copybook-codec/src/options/parse_error.rs \
            crates/copybook-codec/tests/option_parse_errors.rs \
            crates/copybook-options/tests/parse_error_compat.rs \
            docs/MIGRATION_GUIDE.md | sort)"
          test "$actual" = "$expected"

      - name: Replace bootstrap history with final source commit
        env:
          BRANCH: api/typed-codec-option-errors-20260906
          BASE_SHA: ce20efea0b4eb12fbc8b1e57e3471800cd0ea4ba
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          rm .github/workflows/_apply_typed_codec_option_errors.yml
          rm .github/scripts/_apply_typed_codec_option_errors.py
          git add -A
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'feat(codec): add typed option parse errors' | git commit-tree "$tree" -p "$BASE_SHA")"
          git push --force-with-lease="refs/heads/$BRANCH:$GITHUB_SHA" origin "$commit:refs/heads/$BRANCH"
          echo "Final commit: $commit"
