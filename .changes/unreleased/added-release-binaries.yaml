kind: added
body: '**dist**: attach prebuilt `copybook` CLI binaries to GitHub releases
  (`copybook-<version>-<triple>.tar.gz` plus `.sha256` for Linux x86_64,
  macOS Apple Silicon, macOS Intel, and Windows x86_64). Each leg smokes
  its own binary
  (`--version`, `explain`, `doctor`, and `decode` over the bundled demo
  fixtures) before upload.'
