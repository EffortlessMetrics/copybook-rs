# SPDX-License-Identifier: AGPL-3.0-or-later
name: Security (weekly)

# Canonical owner for raw audit artifacts and the findings roll-up issue.
# ci-security.yml remains the minimal weekly cargo-deny/cargo-audit policy gate.

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  weekly-audit:
    name: Weekly Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write  # For automated issue creation

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # v2 avoids restoring the legacy cache that could contain a
          # partially initialized advisory database.
          shared-key: advisory-db-v2
          cache-directories: ~/.cargo/advisory-db

      - name: Install cargo-deny
        run: cargo install cargo-deny@0.19.0 --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Prepare and refresh cargo-audit advisory database
        id: advisory_db
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/ci/prepare_advisory_db.py
          cargo audit fetch --force

      - name: Run cargo deny check
        id: deny
        continue-on-error: true
        run: |
          set +e
          cargo deny check --config deny.toml
          deny_status=$?
          set -e
          echo "exit_status=${deny_status}" >> "$GITHUB_OUTPUT"
          exit "${deny_status}"

      - name: Run cargo audit
        id: audit
        if: always() && steps.advisory_db.outcome == 'success'
        # cargo audit exits 1 on warnings (e.g. unmaintained crates) AND
        # vulnerabilities. Capture JSON regardless; continue-on-error lets
        # the issue step below report actual vulnerabilities.
        continue-on-error: true
        run: |
          mkdir -p target
          set +e
          cargo audit -q --json > target/security.audit.json
          audit_status=$?
          set -e
          echo "exit_status=${audit_status}" >> "$GITHUB_OUTPUT"
          exit "${audit_status}"

      - name: Classify raw cargo-audit output
        id: classify
        if: always()
        run: |
          python3 scripts/ci/classify_security_audit.py \
            classify \
            target/security.audit.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Open/update roll-up issue on findings
        if: steps.classify.outcome == 'success' && steps.classify.outputs.decision == 'create_or_update'
        uses: actions/github-script@v9
        env:
          FINDING_COUNT: ${{ steps.classify.outputs.finding_count }}
        with:
          script: |
            const title = "Weekly Security Audit Findings";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "security"
            });
            const body = `${process.env.FINDING_COUNT} vulnerabilities detected. ` +
              `See raw cargo-audit artifact \`cargo-audit-raw-${context.runId}\`.`;
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["security","infrastructure"] });
            }

      - name: Upload raw cargo-audit output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-raw-${{ github.run_id }}
          path: target/security.audit.json
          retention-days: 90
          if-no-files-found: warn

      - name: Enforce audit and classification outcome
        if: always()
        run: |
          python3 scripts/ci/classify_security_audit.py enforce \
            --deny-exit-status "${{ steps.deny.outputs.exit_status }}" \
            --audit-exit-status "${{ steps.audit.outputs.exit_status }}" \
            --classification-outcome "${{ steps.classify.outcome }}" \
            --decision "${{ steps.classify.outputs.decision }}"
