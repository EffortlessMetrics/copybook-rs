[package]
name = "copybook-codepage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compatibility forwarding package for copybook-charset domain types."
documentation = "https://docs.rs/copybook-codepage"
readme = "README.md"
keywords = ["cobol", "codepage", "ebcdic", "encoding", "ascii"]
categories = ["encoding", "data-structures"]

include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "!**/claude.md"]

[package.metadata.docs.rs]
all-features = false
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
copybook-charset.workspace = true

[features]
default = []

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
