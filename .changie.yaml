# SPDX-License-Identifier: AGPL-3.0-or-later
changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.VersionNoPrefix}}] — {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
kinds:
  - label: Added
    key: added
  - label: Changed
    key: changed
  - label: Deprecated
    key: deprecated
  - label: Removed
    key: removed
  - label: Fixed
    key: fixed
  - label: Security
    key: security
newlines:
  afterChangelogHeader: 1
  beforeKind: 1
  afterKind: 1
  afterChangelogVersion: 1
  endOfVersion: 1
