# SPDX-License-Identifier: AGPL-3.0-or-later
name: Refresh 667 standalone locks

on:
  push:
    branches:
      - codex/642-rust-1-95-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/642-rust-1-95-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Refresh standalone lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            fuzz/Cargo.toml \
            examples/kafka_pipeline/Cargo.toml \
            examples/kafka_streaming/Cargo.toml
          do
            cargo generate-lockfile --manifest-path "${manifest}"
          done
          git diff --check
      - name: Commit lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            fuzz/Cargo.lock \
            examples/kafka_pipeline/Cargo.lock \
            examples/kafka_streaming/Cargo.lock
          if git diff --cached --quiet; then
            echo "Standalone lockfiles already current."
            exit 0
          fi
          git commit -m "build(msrv): refresh standalone Rust 1.95 lockfiles"
          git push origin HEAD:codex/642-rust-1-95-v2
