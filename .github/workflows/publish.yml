# SPDX-License-Identifier: AGPL-3.0-or-later
name: Publish Crates

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.3.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Single source of truth for the release tag. For manual dispatch the input
  # wins; github.ref_name is the branch the dispatch was launched from, not
  # the entered tag, so it must not take precedence.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      plan_json: ${{ steps.publish-plan.outputs.plan_json }}
      plan_count: ${{ steps.publish-plan.outputs.plan_count }}
      plan_sha256: ${{ steps.publish-plan.outputs.plan_sha256 }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ env.RELEASE_TAG }}

    - name: Validate release tag identity
      run: |
        set -euo pipefail

        TAG="${{ env.RELEASE_TAG }}"
        if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Malformed release tag: '${TAG}' (expected vMAJOR.MINOR.PATCH[-prerelease])"
          exit 1
        fi

        TAG_VERSION="${TAG#v}"
        WS_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
        if [[ "${TAG_VERSION}" != "${WS_VERSION}" ]]; then
          echo "Tag '${TAG}' does not match [workspace.package].version '${WS_VERSION}'"
          exit 1
        fi

        git fetch --tags --force origin >/dev/null 2>&1 || true
        TAG_COMMIT=$(git rev-list -n 1 "${TAG}")
        HEAD_COMMIT=$(git rev-parse HEAD)
        if [[ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]]; then
          echo "Checked-out commit ${HEAD_COMMIT} is not the tagged commit ${TAG_COMMIT}"
          exit 1
        fi

        echo "Release tag identity verified: ${TAG} -> ${HEAD_COMMIT} (workspace ${WS_VERSION})"

    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        key: publish

    - name: Preflight checks
      run: |
        echo "Publishing for tag: ${{ env.RELEASE_TAG }}"

        # Verify workspace builds cleanly
        cargo build --workspace --release -j 2

        # Run tests to ensure quality
        cargo test --workspace --exclude copybook-bench --exclude copybook-bdd --release -j 2

        # Validate publishable workspace metadata against crates.io constraints
        python - <<'PY'
        import json
        import subprocess
        import sys
        import urllib.request

        metadata = json.loads(
            subprocess.check_output(
                ["cargo", "metadata", "--format-version", "1", "--no-deps"],
                text=True,
            )
        )
        workspace_members = set(metadata["workspace_members"])
        supported_categories = {
            entry["slug"]
            for entry in json.load(
                urllib.request.urlopen("https://crates.io/api/v1/category_slugs")
            )["category_slugs"]
        }

        errors = []
        checked = 0
        for package in metadata["packages"]:
            if package["id"] not in workspace_members:
                continue

            publish = package.get("publish")
            if publish == []:
                continue

            checked += 1
            keywords = package.get("keywords") or []
            categories = package.get("categories") or []

            if len(keywords) > 5:
                errors.append(
                    f"{package['name']}: expected at most 5 keywords, found {len(keywords)}"
                )
            if len(categories) > 5:
                errors.append(
                    f"{package['name']}: expected at most 5 categories, found {len(categories)}"
                )

            invalid_categories = [
                category for category in categories if category not in supported_categories
            ]
            if invalid_categories:
                errors.append(
                    f"{package['name']}: unsupported crates.io categories: {', '.join(invalid_categories)}"
                )

        if errors:
            print("crates.io metadata preflight failed:", file=sys.stderr)
            for error in errors:
                print(f"  - {error}", file=sys.stderr)
            sys.exit(1)

        print(f"Validated crates.io metadata for {checked} publishable workspace crates.")
        PY

        # Verify a leaf crate packages cleanly.
        cargo package -p copybook-error

        # Verify publish manifests that intentionally keep path-only internal
        # dev-dependencies for workspace tests strip cleanly for crates.io.
        cargo package -p copybook-determinism --no-verify
        cargo package -p copybook-rdw-predicates --no-verify

    - name: Build publish plan
      id: publish-plan
      run: |
        set -euo pipefail

        PLAN_JSON="${{ runner.temp }}/publish-plan.json"
        cargo run -p xtask -- publish plan --check
        cargo run -p xtask -- publish plan --format json > "${PLAN_JSON}"

        PLAN_COUNT=$(python - "${PLAN_JSON}" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            print(len(json.load(handle)))
        PY
        )

        if [ "${PLAN_COUNT}" -le 0 ]; then
          echo "No publishable crates found."
          exit 1
        fi

        PLAN_SHA256=$(sha256sum "${PLAN_JSON}" | cut -d' ' -f1)

        echo "plan_json=${PLAN_JSON}" >> "${GITHUB_OUTPUT}"
        echo "plan_count=${PLAN_COUNT}" >> "${GITHUB_OUTPUT}"
        echo "plan_sha256=${PLAN_SHA256}" >> "${GITHUB_OUTPUT}"

        {
          echo "### Publish plan"
          echo ""
          echo "- packages: ${PLAN_COUNT}"
          echo "- sha256: \`${PLAN_SHA256}\`"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload publish plan
      uses: actions/upload-artifact@v4
      with:
        name: publish-plan-${{ env.RELEASE_TAG }}
        path: ${{ steps.publish-plan.outputs.plan_json }}
        if-no-files-found: error
        retention-days: 90

    - name: Publish all crates in dependency order
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        set -euo pipefail

        retry_delay_for_rate_limit() {
          local output="$1"
          local retry_after
          local now_epoch
          local retry_epoch
          local delay

          retry_after=$(printf '%s\n' "${output}" | sed -n 's/.*Please try again after \(.* GMT\).*/\1/p' | tail -n1)
          if [ -n "${retry_after}" ]; then
            now_epoch=$(date -u +%s)
            retry_epoch=$(date -u -d "${retry_after}" +%s 2>/dev/null || true)
            if [ -n "${retry_epoch}" ]; then
              delay=$((retry_epoch - now_epoch + 5))
              if [ "${delay}" -lt 5 ]; then
                delay=5
              fi
              printf '%s\n' "${delay}"
              return 0
            fi
          fi

          printf '%s\n' 300
        }

        publish_crate() {
          local crate="$1"
          local output
          local attempt=1
          local max_attempts=10
          local retry_delay

          while [ "${attempt}" -le "${max_attempts}" ]; do
            echo "Publishing ${crate} (attempt ${attempt}/${max_attempts})..."
            if output=$(cargo publish -p "${crate}" 2>&1); then
              echo "${output}"
              echo "  ${crate} published successfully"
              return 0
            fi

            echo "${output}"
            if echo "${output}" | grep -q "already exists"; then
              echo "  ${crate} already published, skipping"
              return 0
            fi

            if echo "${output}" | grep -q "status 429 Too Many Requests"; then
              retry_delay=$(retry_delay_for_rate_limit "${output}")
              echo "  crates.io rate limit hit for ${crate}; retrying in ${retry_delay}s"
              sleep "${retry_delay}"
              attempt=$((attempt + 1))
              continue
            fi

            echo "  FAILED to publish ${crate}"
            return 1
          done

          echo "  FAILED to publish ${crate} after ${max_attempts} attempts"
          return 1
        }

        wait_for_index() {
          local seconds="${1:-60}"
          echo "Waiting ${seconds}s for crates.io index propagation..."
          sleep "${seconds}"
        }

        PLAN_JSON="${{ steps.publish-plan.outputs.plan_json }}"
        PLAN_COUNT="${{ steps.publish-plan.outputs.plan_count }}"
        mapfile -t PUBLISH_CRATES < <(python - "$PLAN_JSON" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for crate in json.load(handle):
                print(crate)
        PY
        )

        if [ "${#PUBLISH_CRATES[@]}" -le 0 ]; then
          echo "Publish plan empty."
          exit 1
        fi

        if [ "${PLAN_COUNT}" -ne "${#PUBLISH_CRATES[@]}" ]; then
          echo "Publish plan count mismatch: expected ${PLAN_COUNT}, observed ${#PUBLISH_CRATES[@]}"
          exit 1
        fi

        for crate in "${PUBLISH_CRATES[@]}"; do
          echo "=== Publishing ${crate} ==="
          publish_crate "${crate}"
          if [[ "${crate}" != "copybook-rs" ]]; then
            wait_for_index 60
          fi
        done

        echo ""
        echo "All ${PLAN_COUNT} publishable crates published successfully!"

  smoke-test:
    runs-on: ubuntu-latest
    needs: publish
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ env.RELEASE_TAG }}
    - uses: dtolnay/rust-toolchain@stable
    - name: Run blocking stable-core registry smoke
      run: |
        VERSION="${RELEASE_TAG#v}"
        chmod +x scripts/ci/release_smoke.sh
        scripts/ci/release_smoke.sh "${VERSION}"

  smoke-test-experimental:
    # Advisory only: Arrow and other experimental adapters are not part of the
    # v0.5 stable-core promise. A failure here must produce a follow-up issue,
    # not retroactively fail an already-correct stable-core release.
    runs-on: ubuntu-latest
    needs: publish
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ env.RELEASE_TAG }}
    - uses: dtolnay/rust-toolchain@stable
    - name: Run advisory experimental-adapter smoke
      run: |
        VERSION="${RELEASE_TAG#v}"
        chmod +x scripts/ci/release_smoke.sh
        RELEASE_SMOKE_ADVISORY=1 scripts/ci/release_smoke.sh "${VERSION}"

  github-release:
    # The user-facing release is created only after crates.io publication and
    # the blocking stable-core registry smoke have both succeeded. crates.io
    # publication is irreversible; the GitHub release is not, so it comes last.
    runs-on: ubuntu-latest
    needs: [publish, smoke-test]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ env.RELEASE_TAG }}
    - name: Download publish plan
      uses: actions/download-artifact@v4
      with:
        name: publish-plan-${{ env.RELEASE_TAG }}
        path: ${{ runner.temp }}
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        tag="${RELEASE_TAG}"
        version="${tag#v}"
        repo_url="https://github.com/${{ github.repository }}"

        PLAN_JSON="${{ runner.temp }}/publish-plan.json"
        python - "${PLAN_JSON}" "${version}" "${repo_url}" "${tag}" <<'PY' > release-notes.md
        import json
        import sys

        plan_path, version, repo_url, tag = sys.argv[1:]

        with open(plan_path, encoding="utf-8") as handle:
            crates = json.load(handle)

        print(f"## copybook-rs {version}")
        print("")
        print("**Installation:**")
        print("```bash")
        print(f"cargo install copybook-cli@{version}")
        print("```")
        print("")
        print(f"**Published Crates ({len(crates)}):**")
        print("")
        print("| Crate | crates.io | docs.rs |")
        print("|-------|-----------|---------|")
        for crate in crates:
            print(f"| {crate} | [{version}](https://crates.io/crates/{crate}/{version}) | [docs](https://docs.rs/{crate}/{version}) |")
        print("")
        print(f"See [CHANGELOG.md]({repo_url}/blob/{tag}/CHANGELOG.md) for details.")
        PY

        if gh release view "${tag}" >/dev/null 2>&1; then
          gh release edit "${tag}" --title "copybook-rs ${version}" --notes-file release-notes.md
          echo "Updated release ${tag}"
        elif [[ "${version}" == *-* ]]; then
          gh release create "${tag}" --title "copybook-rs ${version}" --notes-file release-notes.md --prerelease
          echo "Created prerelease ${tag}"
        else
          gh release create "${tag}" --title "copybook-rs ${version}" --notes-file release-notes.md
          echo "Created release ${tag}"
        fi

    - name: Print docs.rs links (informational)
      run: |
        VERSION="${RELEASE_TAG#v}"

        echo "docs.rs builds asynchronously; links below become valid as builds complete."
        for crate in copybook copybook-rs copybook-core copybook-codec copybook-arrow copybook-cli; do
          echo "https://docs.rs/${crate}/${VERSION}"
        done

  notify-success:
    runs-on: ubuntu-latest
    needs: [publish, smoke-test, github-release]
    if: success()
    steps:
    - name: Success notification
      run: |
        VERSION="${RELEASE_TAG#v}"

        echo "Successfully published copybook-rs ${VERSION}!"
        echo ""
        echo "Installation:"
        echo "   cargo install copybook-cli@${VERSION}"
        echo ""
        echo "Documentation:"
        echo "   https://docs.rs/copybook-core/${VERSION}"
        echo "   https://docs.rs/copybook/${VERSION}"
        echo "   https://docs.rs/copybook-rs/${VERSION}"
        echo "   https://docs.rs/copybook-codec/${VERSION}"
        echo "   https://docs.rs/copybook-arrow/${VERSION}"
        echo "   https://docs.rs/copybook-cli/${VERSION}"
        echo ""
        echo "Crates.io:"
        echo "   https://crates.io/crates/copybook-core"
        echo "   https://crates.io/crates/copybook"
        echo "   https://crates.io/crates/copybook-codec"
        echo "   https://crates.io/crates/copybook-rs"
        echo "   https://crates.io/crates/copybook-arrow"
        echo "   https://crates.io/crates/copybook-cli"
