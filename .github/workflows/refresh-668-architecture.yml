# SPDX-License-Identifier: AGPL-3.0-or-later
name: Refresh 668 architecture proof

on:
  push:
    branches:
      - codex/644-architecture-check
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: refresh-668-architecture
  cancel-in-progress: true

jobs:
  normalize-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/644-architecture-check
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Split boundary validation into reviewable seams
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/xtask/src/architecture.rs')
          text = path.read_text(encoding='utf-8')
          if 'fn validate_owner_contract(' not in text:
              function = text.index('fn validate_boundary_contract(')
              start = text.index(
                  '    if !workspace_names.contains(&boundary.true_owner) {',
                  function,
              )
              end = text.index('    if let Some(expected)', start)
              calls = '''    validate_owner_contract(name, boundary, workspace_names, violations);
              validate_publish_contract(package, registry_package, boundary, violations);

          '''.replace('              ', '')
              text = text[:start] + calls + text[end:]

              insert = text.index('fn validate_stability_contract(')
              helpers = '''fn validate_owner_contract(
              name: &str,
              boundary: &Boundary,
              workspace_names: &BTreeSet<String>,
              violations: &mut Vec<Violation>,
          ) {
              if !workspace_names.contains(&boundary.true_owner) {
                  violations.push(Violation::for_package(
                      format!("owner-missing:{name}:{}", boundary.true_owner),
                      format!(
                          "package {name} names non-workspace owner {}",
                          boundary.true_owner
                      ),
                      name,
                  ));
              }
              if matches!(boundary.role.as_str(), "compat" | "retiring")
                  && boundary.true_owner == name
              {
                  violations.push(Violation::for_package(
                      format!("owner-self:{name}"),
                      format!("{name} cannot be its own owner while marked {}", boundary.role),
                      name,
                  ));
              }
          }

          fn validate_publish_contract(
              package: &MetadataPackage,
              registry_package: &RegistryPackage,
              boundary: &Boundary,
              violations: &mut Vec<Violation>,
          ) {
              let name = package.name.as_str();
              let manifest_publishable = is_publishable(package.publish.as_ref());
              if manifest_publishable != registry_package.publish {
                  violations.push(Violation::for_package(
                      format!("publish-mismatch:{name}"),
                      format!(
                          "package {name} manifest publishability ({manifest_publishable}) disagrees with registry ({})",
                          registry_package.publish
                      ),
                      name,
                  ));
              }
              if registry_package.publish
                  && (blank(boundary.external_user_story.as_deref())
                      || blank(boundary.invariant_owned.as_deref()))
              {
                  violations.push(Violation::for_package(
                      format!("published-contract-incomplete:{name}"),
                      format!(
                          "published package {name} must declare an external or migration story and owned invariant"
                      ),
                      name,
                  ));
              }
              if boundary.role == "internal-tool" && registry_package.publish {
                  violations.push(Violation::for_package(
                      format!("internal-tool-published:{name}"),
                      format!("internal tool package {name} must not be publishable"),
                      name,
                  ));
              }
              if boundary.role != "internal-tool" && !registry_package.publish {
                  violations.push(Violation::for_package(
                      format!("non-tool-unpublished:{name}"),
                      format!(
                          "non-tool package {name} must either be publishable or reclassified as internal-tool"
                      ),
                      name,
                  ));
              }
          }

          '''.replace('          ', '')
              text = text[:insert] + helpers + text[insert:]
              path.write_text(text, encoding='utf-8')
          PY
      - name: Separate hard contracts from shrinking migration debt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/xtask/src/architecture.rs')
          text = path.read_text(encoding='utf-8')

          old = '''pub fn run_check() -> Result<()> {
              let report = analyze()?;
              let debt = read_debt()?;
              validate_debt_file(&debt)?;
              validate_debt(&report.violations, &debt.entries)?;
              println!(
                  "architecture check passed: {} package(s), {} tracked violation(s)",
                  report.packages.len(),
                  report.violations.len()
              );
              Ok(())
          }
          '''.replace('          ', '')
          new = '''pub fn run_check() -> Result<()> {
              let report = analyze()?;
              validate_hard_contracts(&report.violations)?;
              let debt = read_debt()?;
              validate_debt_file(&debt)?;
              validate_debt(&report.violations, &debt.entries)?;
              let tracked = report
                  .violations
                  .iter()
                  .filter(|violation| is_debt_id(&violation.id))
                  .count();
              println!(
                  "architecture check passed: {} package(s), {} tracked violation(s)",
                  report.packages.len(),
                  tracked
              );
              Ok(())
          }
          '''.replace('          ', '')
          if old in text:
              text = text.replace(old, new, 1)

          old = '''    let mut entries = report
                  .violations
                  .iter()
                  .map(|violation| DebtEntry {
          '''.replace('              ', '')
          new = '''    let mut entries = report
                  .violations
                  .iter()
                  .filter(|violation| is_debt_id(&violation.id))
                  .map(|violation| DebtEntry {
          '''.replace('              ', '')
          if old in text:
              text = text.replace(old, new, 1)

          if 'fn validate_hard_contracts(' not in text:
              marker = 'fn validate_debt_file(debt: &DebtFile) -> Result<()> {'
              helper = '''fn validate_hard_contracts(violations: &[Violation]) -> Result<()> {
              let hard = violations
                  .iter()
                  .filter(|violation| !is_debt_id(&violation.id))
                  .map(|violation| format!("{}: {}", violation.id, violation.message))
                  .collect::<Vec<_>>();
              if !hard.is_empty() {
                  bail!(
                      "package architecture contract is invalid; these findings cannot be baselined:\n  - {}",
                      hard.join("\n  - ")
                  );
              }
              Ok(())
          }

          '''.replace('          ', '')
              text = text.replace(marker, helper + marker, 1)

          old = '''    for entry in &debt.entries {
                  if !seen.insert(entry.id.as_str()) {
          '''.replace('              ', '')
          new = '''    for entry in &debt.entries {
                  if !is_debt_id(&entry.id) {
                      bail!(
                          "architecture debt entry {} is a hard contract finding and cannot be baselined",
                          entry.id
                      );
                  }
                  if !seen.insert(entry.id.as_str()) {
          '''.replace('              ', '')
          if old in text:
              text = text.replace(old, new, 1)

          old = '''    let current = violations
                  .iter()
                  .map(|violation| violation.id.clone())
          '''.replace('              ', '')
          new = '''    let current = violations
                  .iter()
                  .filter(|violation| is_debt_id(&violation.id))
                  .map(|violation| violation.id.clone())
          '''.replace('              ', '')
          if old in text:
              text = text.replace(old, new, 1)

          if 'fn is_debt_id(' not in text:
              marker = 'fn owner_issue(id: &str) -> u64 {'
              helper = '''fn is_debt_id(id: &str) -> bool {
              [
                  "primary-dep:",
                  "core-upward:",
                  "edge-upward:",
                  "library-cli-framework:",
                  "library-cli-feature:",
              ]
              .iter()
              .any(|prefix| id.starts_with(prefix))
          }

          '''.replace('          ', '')
              text = text.replace(marker, helper + marker, 1)

          start = text.index('    #[test]\n    fn debt_validation_rejects_new_and_stale_entries()')
          end = text.index('    #[test]\n    fn alias_source_accepts_only_crate_metadata_and_redirect()', start)
          tests = '''    #[test]
              fn debt_validation_rejects_new_and_stale_entries() {
                  let violations = vec![
                      Violation::for_package(
                          "primary-dep:copybook->copybook-utils",
                          "a",
                          "copybook",
                      ),
                      Violation::for_package(
                          "library-cli-framework:copybook-options->clap",
                          "b",
                          "copybook-options",
                      ),
                  ];
                  let exact = vec![
                      DebtEntry {
                          id: "library-cli-framework:copybook-options->clap".into(),
                          owner_issue: 653,
                      },
                      DebtEntry {
                          id: "primary-dep:copybook->copybook-utils".into(),
                          owner_issue: 655,
                      },
                  ];
                  assert!(validate_debt(&violations, &exact).is_ok());

                  let stale = vec![DebtEntry {
                      id: "primary-dep:copybook->copybook-utils".into(),
                      owner_issue: 655,
                  }];
                  assert!(validate_debt(&violations, &stale).is_err());
              }

              #[test]
              fn debt_file_requires_sorted_unique_owner_routed_entries() {
                  let valid = DebtFile {
                      schema_version: 1,
                      entries: vec![
                          DebtEntry {
                              id: "library-cli-framework:copybook-options->clap".into(),
                              owner_issue: 653,
                          },
                          DebtEntry {
                              id: "primary-dep:copybook->copybook-utils".into(),
                              owner_issue: 655,
                          },
                      ],
                  };
                  assert!(validate_debt_file(&valid).is_ok());

                  let duplicate = DebtFile {
                      schema_version: 1,
                      entries: vec![
                          DebtEntry {
                              id: "primary-dep:copybook->copybook-utils".into(),
                              owner_issue: 655,
                          },
                          DebtEntry {
                              id: "primary-dep:copybook->copybook-utils".into(),
                              owner_issue: 655,
                          },
                      ],
                  };
                  assert!(validate_debt_file(&duplicate).is_err());

                  let hard_finding = DebtFile {
                      schema_version: 1,
                      entries: vec![DebtEntry {
                          id: "registry-missing:copybook".into(),
                          owner_issue: 640,
                      }],
                  };
                  assert!(validate_debt_file(&hard_finding).is_err());

                  let wrong_owner = DebtFile {
                      schema_version: 1,
                      entries: vec![DebtEntry {
                          id: "primary-dep:copybook-core->copybook-lexer".into(),
                          owner_issue: 640,
                      }],
                  };
                  assert!(validate_debt_file(&wrong_owner).is_err());
              }

              #[test]
              fn hard_contract_findings_fail_without_entering_debt() {
                  let violations = vec![Violation::for_package(
                      "registry-missing:copybook",
                      "missing",
                      "copybook",
                  )];
                  assert!(validate_hard_contracts(&violations).is_err());
                  assert!(validate_debt(&violations, &[]).is_ok());
              }

          '''.replace('              ', '')
          text = text[:start] + tests + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Fix bounded xtask test-target lints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/xtask/src/docs_verify.rs')
          text = path.read_text(encoding='utf-8')
          if 'reason = "Verifier callbacks share' not in text:
              text = text.replace(
                  '    fn ok() -> Result<()> {\n',
                  '    #[expect(clippy::unnecessary_wraps, reason = "Verifier callbacks share the Result-returning function signature")]\n    fn ok() -> Result<()> {\n',
                  1,
              )
          if 'reason = "Order probes share' not in text:
              text = text.replace(
                  '    fn record_order(name: &\'static str) -> Result<()> {\n',
                  '    #[expect(clippy::unnecessary_wraps, reason = "Order probes share the Result-returning verifier signature")]\n    fn record_order(name: &\'static str) -> Result<()> {\n',
                  1,
              )
          text = text.replace(
              '.map(|path| path.to_string())',
              '.map(ToString::to_string)',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Normalize and prove architecture controls
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo run -p xtask -- architecture debt-generate
          cargo fmt --all -- --check
          cargo clippy -p xtask --all-targets -- -D warnings -W clippy::pedantic
          cargo test -p xtask
          cargo run -p xtask -- architecture check
          cargo run -p xtask -- architecture report --format json > /tmp/architecture-report.json
          python3 -m json.tool /tmp/architecture-report.json >/dev/null
          git diff --check
      - name: Commit normalized controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            docs/architecture/package-boundary-debt.json \
            scripts/ci/quick.sh \
            tools/xtask/src/architecture.rs \
            tools/xtask/src/docs_verify.rs \
            tools/xtask/src/lib.rs \
            tools/xtask/src/main.rs
          if git diff --cached --quiet; then
            echo "Architecture controls already normalized."
            exit 0
          fi
          git commit -m "feat(xtask): normalize package architecture controls"
          git pull --rebase origin codex/644-architecture-check
          git push origin HEAD:codex/644-architecture-check
