kind: fixed
body: '**charset**: correct six wrong EBCDIC slots against independent references
  (glibc iconv primary, CPython cross-check, ICU UCM authority) — CP1140 Euro
  moves from `0xFF` to `0x9F` (`0xFF` is U+009F), CP273 `0x59`/`0xA1` become
  `~`/`ß`, CP1047 `0x5F`/`0xB0` become `^`/`¬`. Adds pinned 256-slot oracle
  fixtures plus red-first regressions, repairs dependent charset/codec/CLI
  expectations, strengthens the worker oracle, extends the release smoke with
  an installed-binary witness, and documents byte-output consequences under
  `docs/migration/0.8.1.md`.'
