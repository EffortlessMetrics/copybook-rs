# cargo-release configuration for copybook-rs workspace.
# Version-bump helper only: prepare changelog fragments/releases with Changie
# in a reviewed PR as documented in docs/RELEASE_RUNBOOK.md.
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"
sign-tag = true
sign-commit = false
publish = false
push-remote = "origin"
push = true
pre-release-commit-message = "chore(release): prepare v{{version}}"
allow-branch = ["main"]
dependent-version = "fix"
shared-version = true
consolidate-commits = true
