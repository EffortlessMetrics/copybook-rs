[[capability]]
capability_id = "line-delimited-fixed"
user_file_story = "Decode line-delimited mainframe-unload text with fixed-width fields per line, without stripping newlines by hand first."
physical_organization = "line-delimited (LF/CRLF) fixed-width records"
layout_organization = "single 01-level layout"
public_fixtures_available = ["docs/evidence/differential-breadth/lines8.txt (two 8-byte lines + LF, lane 2)"]
private_redacted_receipts_observed = []
external_implementations_pinned = ["JRecord 0.93.2 Cobol2Csv -IFS Text: strips terminators and splits both rows; the runnable oracle"]
current_copybook_rs_behavior = "No text framing exists: the newline is a data byte, so lines8.txt ends mid-record with CBKR101_FIXED_RECORD_ERROR."
independent_oracle_authority = "JRecord 0.93.2 Text behavior plus POSIX line definition for terminator semantics"
read_requirement = "new text framing: LF/CRLF terminators, explicit final-line-without-terminator policy, embedded-newline rejection"
write_requirement = "symmetric emission with a configured terminator"
raw_accounting_requirement = "terminators are framing, excluded from payloads and raw capture"
candidate_stability_class = "stable"
selected_release = "0.10"
selection_rationale = "Crisp file story with a runnable oracle on the exact gap: strip-and-split semantics are demonstrated, not designed from scratch."
stop_rule = "Never treat a terminator as data silently; a final line without terminator follows the explicit policy, not a guess."

[[capability]]
capability_id = "framing-extension-seam"
user_file_story = "Add a third-plus framing kind (text, prefixes) without forking the decode, policy, and accounting paths per kind."
physical_organization = "n/a (internal extension surface)"
layout_organization = "n/a"
public_fixtures_available = []
private_redacted_receipts_observed = []
external_implementations_pinned = []
current_copybook_rs_behavior = "RecordFormat is a closed three-variant enum (Fixed, RDW, Vb); new organizations need a new variant plus per-site handling. Evidenced by code inspection."
independent_oracle_authority = "n/a (internal surface)"
read_requirement = "framing implementors plug record-boundary iteration into the shared policy/decode/accounting paths"
write_requirement = "symmetric encode-side framing through the same seam"
raw_accounting_requirement = "framing-vs-payload accounting enforced by the seam, not by each kind"
candidate_stability_class = "beta"
