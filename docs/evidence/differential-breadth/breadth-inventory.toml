[[capability]]
capability_id = "multisegment-assembly"
user_file_story = "Reassemble parent/child segment streams into hierarchical records keyed explicitly, without hand-joining JSONL first."
physical_organization = "segmented records with key linkage"
layout_organization = "multiple layouts assembled by key"
public_fixtures_available = []
private_redacted_receipts_observed = []
external_implementations_pinned = ["Cobrix (named comparator, inconclusive: no Spark runtime and no pinned local artifact available; missing comparators never count as agreement)"]
current_copybook_rs_behavior = "No assembly surface exists; segments decode as independent records."
independent_oracle_authority = "none yet: needs key/ordering design plus a Spark-free oracle (hand-built families; JRecord multi-record as adjacent evidence)"
read_requirement = "key-explicit assembly with declared ordering; orphan segments classified, never dropped silently"
write_requirement = "segment emission preserving the declared order"
raw_accounting_requirement = "assembled identity carries segment provenance"
