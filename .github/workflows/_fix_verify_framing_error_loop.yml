# SPDX-License-Identifier: AGPL-3.0-or-later
name: Apply verify review fixes

on:
  push:
    branches:
      - fix/verify-codec-framed-error-samples-20260905

permissions:
  contents: write

concurrency:
  group: verify-review-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/verify-codec-framed-error-samples-20260905
          fetch-depth: 0

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply actionable review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected replacement in {path} was not found exactly once")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          verify = Path("crates/copybook-cli/src/commands/verify.rs")
          replace_once(
              verify,
              """            Err(error) => {
                          records_total += 1;
                          record_verification_error(&mut verify_report, records_total - 1, &error, None);
                          if record_iter.is_eof() {
                              break;
                          }
                      }
          """,
              """            Err(error) => {
                          records_total += 1;
                          record_verification_error(&mut verify_report, records_total - 1, &error, None);
                          // A framing error leaves no reliable record boundary from which
                          // verification can resume.
                          break;
                      }
          """,
          )

          old_test = "verify_samples_are_limited_and_use_codec_record_bytes"
          new_test = "encoding_verify_samples_use_codec_framed_payloads"
          replace_once(
              Path("tests/e2e/e2e_verify_comprehensive.rs"),
              f"fn {old_test}()",
              f"fn {new_test}()",
          )
          replace_once(
              Path("docs/evidence/fixed-rdw-pipeline.toml"),
              f"tests/e2e/e2e_verify_comprehensive.rs::{old_test}",
              f"tests/e2e/e2e_verify_comprehensive.rs::{new_test}",
          )
          PY

      - name: Format, stage gated inputs, and sync evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          git add \
            crates/copybook-cli/src/commands/verify.rs \
            tests/e2e/e2e_verify_comprehensive.rs
          cargo +1.95.0 run --locked -p xtask -- docs sync-record-pipeline
          git add docs/evidence/fixed-rdw-pipeline.toml

      - name: Build CLI for cross-package E2E tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 build --locked -p copybook-cli --bin copybook
          echo "CARGO_BIN_EXE_copybook=${GITHUB_WORKSPACE}/target/debug/copybook" >> "$GITHUB_ENV"

      - name: Verify focused behavior and policy
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked -p copybook-e2e --test e2e_verify_comprehensive encoding_verify_samples_use_codec_framed_payloads
          cargo +1.95.0 test --locked -p copybook-e2e --test e2e_verify_comprehensive verify_truncated_record_detected
          cargo +1.95.0 clippy --locked -p copybook-cli --bin copybook -- -D warnings -W clippy::pedantic
          cargo +1.95.0 run --locked -p xtask -- docs verify-record-pipeline
          cargo +1.95.0 fmt --all -- --check
          git diff --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            crates/copybook-cli/src/commands/verify.rs \
            docs/evidence/fixed-rdw-pipeline.toml \
            tests/e2e/e2e_verify_comprehensive.rs | sort)"
          test "$actual" = "$expected"

      - name: Commit reviewed source and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          rm .github/workflows/_fix_verify_framing_error_loop.yml
          rm .github/scripts/_fix_verify_framing_error_loop.py
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/_fix_verify_framing_error_loop.py \
            .github/workflows/_fix_verify_framing_error_loop.yml \
            crates/copybook-cli/src/commands/verify.rs \
            docs/evidence/fixed-rdw-pipeline.toml \
            tests/e2e/e2e_verify_comprehensive.rs | sort)"
          test "$actual" = "$expected"
          git commit -m "fix(cli): finish codec-framed verify diagnostics"
          git push origin HEAD:fix/verify-codec-framed-error-samples-20260905
