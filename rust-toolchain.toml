# Pinned developer/CI toolchain so `cargo fmt` (and every other gate) is
# identical everywhere. MSRV is 1.98 (see `rust-version` in Cargo.toml) and
# is enforced separately by `just check-msrv` (`cargo +1.98.0`), which
# overrides this pin.
[toolchain]
channel = "1.98"
components = ["rustfmt", "clippy"]
