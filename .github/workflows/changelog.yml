name: Changelog

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  changes:
    name: Classify changelog requirement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Push events compare HEAD against its parent; PR events fetch the
          # exact base/head SHAs below instead of assuming depth.
          fetch-depth: 2

      - name: Fetch PR endpoints
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }}

      - name: Classify changed paths
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD='${{ github.event.pull_request.head.sha }}'
          else
            BASE='HEAD~1'
            HEAD='HEAD'
          fi
          git diff --name-status --find-renames "$BASE" "$HEAD" -- . ':!.git' \
            | python3 scripts/ci/changelog_gate.py

  validate:
    name: Validate Changie
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test changelog classifier
        run: python3 scripts/ci/test_changelog_gate.py

      - name: Install Changie
        # changie-action v3.0.1; installs the Changie binary pinned below
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4
        with:
          version: v1.26.0

      - name: Verify workspace version has a batched changelog
        shell: bash
        run: |
          VERSION="$(
            python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("Cargo.toml").open("rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )"
          test -n "${VERSION}"
          VERSION_FILE=".changes/v${VERSION}.md"
          test -f "${VERSION_FILE}"

          # The filename alone is not proof: the version file must label the
          # workspace release, and the merged changelog must contain exactly
          # one section for it.
          grep -Eq "^## \[${VERSION}\] — [0-9]{4}-[0-9]{2}-[0-9]{2}\$" "${VERSION_FILE}" || {
            echo "::error::${VERSION_FILE} must start with '## [${VERSION}] — <date>'"
            exit 1
          }
          test "$(grep -cE "^## \[${VERSION}\] — " CHANGELOG.md)" -eq 1 || {
            echo "::error::CHANGELOG.md must contain exactly one '## [${VERSION}]' section"
            exit 1
          }

      - name: Validate unreleased fragments
        run: changie batch patch --dry-run

      - name: Rebuild changelog from version files
        run: changie merge --dry-run > /tmp/CHANGELOG.md

      - name: Verify canonical changelog is reproducible
        run: diff -u CHANGELOG.md /tmp/CHANGELOG.md
