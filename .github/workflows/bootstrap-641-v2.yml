# SPDX-License-Identifier: AGPL-3.0-or-later
name: Bootstrap issue 641 v2

on:
  push:
    branches:
      - codex/641-package-roles

permissions:
  contents: write

jobs:
  classify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/641-package-roles
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate package-role source truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/bootstrap-641.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          Path('/tmp/bootstrap_641.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/bootstrap_641.py
          python3 -m json.tool docs/stability/surface-registry.json >/dev/null

      - name: Validate package-role source truth
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p xtask
          cargo test -p xtask docs_verify::tests::verify_stability_registry_matches_current_workspace
          git diff --check

      - name: Commit final package-role diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-641.yml .github/workflows/bootstrap-641-v2.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "docs(architecture): define package roles and true owners"
          git push origin HEAD:codex/641-package-roles
